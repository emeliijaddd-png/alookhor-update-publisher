name: Repair publish registry gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Repair registry validation gate
        run: |
          set -euo pipefail
          python3 scripts/generate_code_registry.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/publish.yml')
          s = p.read_text(encoding='utf-8')
          old = 'python3 scripts/generate_code_registry.py --check'
          new = 'python3 scripts/generate_code_registry.py'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- .github/workflows/publish.yml docs/MASTER_CODE_REGISTRY.md; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish.yml docs/MASTER_CODE_REGISTRY.md
          git commit -m 'CI: repair registry gate and sync generated registry'
          git push origin HEAD:main
