name: Temporary live site connectivity check
on:
  push:
    branches: [diagnostic/live-site-check-20260908]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live cart
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --max-time 30 https://alookhor.ir/cart/ -o /tmp/cart.html
          echo '--- CART SIZE ---'
          wc -c /tmp/cart.html
          echo '--- ARENA CART COUNT ---'
          grep -o 'id="alookhor-cart"' /tmp/cart.html | wc -l
          echo '--- NATIVE CART MARKERS ---'
          for p in 'woocommerce-cart-form' 'cart-collaterals' 'cart_totals' 'woocommerce-cart' 'woodmart-cart' 'wd-cart'; do echo "$p=$(grep -oi "$p" /tmp/cart.html | wc -l)"; done
          echo '--- WOODMART MARKERS ---'
          grep -oiE 'woodmart[^"< ]*|wd-[a-z0-9_-]+' /tmp/cart.html | sort -u | head -100 || true
          echo '--- MAIN CART TITLES ---'
          grep -oE '<h[1-3][^>]*>[^<]+' /tmp/cart.html | head -30 || true
