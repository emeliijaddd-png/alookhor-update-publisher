name: Temporary live site connectivity check
on:
  push:
    branches: [diagnostic/live-site-check-20260908]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live product pages
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --max-time 30 https://alookhor.ir/ -o /tmp/home.html
          echo '--- PRODUCT LINKS FROM HOMEPAGE ---'
          grep -Eo 'https://alookhor\.ir/[^"'"' ]+' /tmp/home.html | grep -Ei '/product|/محصول' | sort -u | head -50 || true
          echo '--- SITEMAP INDEX ---'
          curl -fsSL --max-time 30 https://alookhor.ir/wp-sitemap.xml -o /tmp/sitemap.xml || true
          grep -Eo 'https://alookhor\.ir/[^<]+' /tmp/sitemap.xml | head -100 || true
          echo '--- COMMON PRODUCT URL ---'
          curl -fsSL --max-time 30 -o /tmp/product.html https://alookhor.ir/product/ || true
          if [ -s /tmp/product.html ]; then wc -c /tmp/product.html; grep -o '<title>[^<]*' /tmp/product.html | head -3; grep -o 'id="alookhor-pdp"' /tmp/product.html | wc -l; grep -o 'woodmart[^" ]*' /tmp/product.html | head -20 || true; fi
