name: Temporary live site connectivity check
on:
  push:
    branches: [diagnostic/live-site-check-20260908]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live cart
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --max-time 30 'https://alookhor.ir/cart/?livecheck=20260908b' -o /tmp/cart.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/cart.html').read_text(errors='ignore')
          for marker in ['id="alookhor-cart"','woocommerce-cart-form','cart-collaterals','cart_totals','<footer']:
              pos=h.lower().find(marker.lower())
              print('\n=== MARKER',marker,'POS',pos,'===')
              if pos>=0: print(h[max(0,pos-2500):pos+4500])
          PY
