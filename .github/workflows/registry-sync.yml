name: Sync generated code registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Regenerate registry
        run: python3 scripts/generate_code_registry.py

      - name: Commit registry when source changed
        run: |
          if git diff --quiet -- docs/MASTER_CODE_REGISTRY.md; then
            echo 'Registry already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/MASTER_CODE_REGISTRY.md
          git commit -m 'chore: sync generated code registry'
          git push origin HEAD:main
