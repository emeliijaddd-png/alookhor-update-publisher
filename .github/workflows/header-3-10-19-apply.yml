name: Apply Header 3.10.19 CSS fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('plugin/alookhor-control-center/assets/css/frontend-header.css')
          s=p.read_text(encoding='utf-8')
          old='width:min(1120px,100%);'
          new='width:min(1360px,calc(100% - 48px));'
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          else:
              print('CSS already changed or source declaration differs; no CSS change made.')
          PY
      - name: Commit CSS change
        run: |
          git config user.name 'ChatGPT Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin/alookhor-control-center/assets/css/frontend-header.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: align header 3.10.19 desktop capsule width'
          git push
