name: Build and Publish ALOOKHOR Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alookhor-production-publisher-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate and generate registry
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          python3 scripts/generate_code_registry.py
          find plugin/alookhor-control-center -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          while IFS= read -r file; do node --check "$file"; done < <(find plugin/alookhor-control-center/assets/js -name '*.js' -type f | sort)
      - name: Build release
        id: release
        run: python3 scripts/build_release.py
      - name: Verify package
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          m=json.loads(Path('public/manifest.json').read_text())
          p=Path('public/releases')/Path(m['download_url']).name
          assert p.is_file()
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          with ZipFile(p) as z: assert z.testzip() is None
          print('Release verification passed:',m['version'])
          PY
      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: alookhor-release-${{ steps.release.outputs.version }}
          path: public/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build verified release
        run: python3 scripts/build_release.py
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Emergency disable broken live plugin
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          from urllib.parse import quote
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip(); user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']
          auth=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          c=['set cmd:fail-exit true','set net:max-retries 3','set net:timeout 30','set ftp:passive-mode true','set ftp:ssl-auth TLS','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true',f'open -p {port} "{auth}"','cd "public_html/wp-content/plugins"','mv alookhor-control-center alookhor-control-center-disabled','bye']
          p=Path('/tmp/disable.lftp'); p.write_text('\\n'.join(c)+'\\n'); p.chmod(0o600)
          q=subprocess.run(['lftp','-f',str(p)],capture_output=True,text=True); print(q.stdout); print(q.stderr); q.check_returncode()
          PY
          sleep 3
          curl -sS --max-time 30 -o /tmp/site.html -w 'HTTP=%{http_code}\\n' https://alookhor.ir/
          ! grep -qi 'Fatal error' /tmp/site.html
          echo "SITE_RECOVERED_WITH_PLUGIN_DISABLED"

      - name: Exact live file repair and verification
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,hashlib
          from pathlib import Path
          from urllib.parse import quote
          repo=Path('plugin/alookhor-control-center')
          files={'alookhor-control-center.php':repo/'alookhor-control-center.php','includes/shortcode-header.php':repo/'includes/shortcode-header.php'}
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip(); user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']
          auth=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          common=['set cmd:fail-exit true','set net:max-retries 3','set net:timeout 30','set ftp:passive-mode true','set ftp:ssl-auth TLS','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true',f'open -p {port} "{auth}"']
          for rel,src in files.items():
            local=f'/tmp/{Path(rel).name}'; Path(local).write_bytes(src.read_bytes())
            remote_dir='public_html/wp-content/plugins/alookhor-control-center'
            remote=remote_dir+'/'+rel
            tmp=remote+'.repairtmp'
            cmds=common+[f'put {local} -o {tmp}',f'mv {tmp} {remote}','bye']
            p=Path('/tmp/fix.lftp'); p.write_text('\\n'.join(cmds)+'\\n'); p.chmod(0o600); subprocess.run(['lftp','-f',str(p)],check=True)
            cmds=common+[f'cd "{remote_dir}"',f'cat "{rel}"','bye']
            p.write_text('\\n'.join(cmds)+'\\n'); q=subprocess.run(['lftp','-f',str(p)],capture_output=True,check=True)
            actual=q.stdout
            expected=src.read_bytes(); print(rel,'EXPECTED',hashlib.sha256(expected).hexdigest(),'REMOTE',hashlib.sha256(actual).hexdigest(),'BYTES',len(actual)); assert actual==expected, rel+' remote content mismatch'
          print('EXACT_LIVE_FILES_MATCH_REPOSITORY')
          PY
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          from urllib.parse import quote
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip(); user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']
          auth=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          c=['set cmd:fail-exit true','set net:max-retries 3',f'open -p {port} "{auth}"','cd "public_html/wp-content/plugins"','mv alookhor-control-center-disabled alookhor-control-center','bye']
          p=Path('/tmp/activate.lftp'); p.write_text('\\n'.join(c)+'\\n'); p.chmod(0o600); subprocess.run(['lftp','-f',str(p)],check=True)
          PY
          sleep 3

      - name: Five live site tests before publish
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 30 -o "/tmp/site-$i.html" -w '%{http_code}' https://alookhor.ir/)
            echo "LIVE_TEST_$i HTTP=$code"
            test "$code" = "200"
            ! grep -qi 'Fatal error' "/tmp/site-$i.html"
            ! grep -qi 'Cannot redeclare' "/tmp/site-$i.html"
            sleep 2
          done
          echo "FIVE_LIVE_TESTS_PASSED"

      - name: Repair-only gate
        run: echo "REPAIR_ONLY=true" >> "$GITHUB_ENV"

      - name: Publish through explicit FTPS
        if: env.REPAIR_ONLY != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"; test -n "$FTP_PORT"; test -n "$FTP_USERNAME"; test -n "$FTP_PASSWORD"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.parse import quote
          m=json.loads(Path('public/manifest.json').read_text())
          package=Path(m['download_url']).name
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip()
          user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']
          if not port.isdigit(): raise SystemExit('Invalid FTP_PORT')
          auth=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          common=['set cmd:fail-exit true','set net:max-retries 2','set net:timeout 30','set ftp:passive-mode true','set ftp:ssl-auth TLS','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true',f'open -p {port} "{auth}"']
          files={
            '/tmp/upload-package.lftp':common+['# releases directory already exists on the FTP target',f'put public/releases/{package} -o releases/{package}','bye'],
            '/tmp/upload-meta.lftp':common+['put public/releases/SHA256SUMS.txt -o releases/SHA256SUMS.txt','put public/index.html -o index.html','put public/changelog.html -o changelog.html','put public/.htaccess -o .htaccess','bye'],
            '/tmp/upload-manifest.lftp':common+['put public/manifest.json -o manifest.json.next','mv manifest.json.next manifest.json','bye']}
          for name,commands in files.items():
            Path(name).write_text('\n'.join(commands)+'\n'); Path(name).chmod(0o600)
          PY
          lftp -f /tmp/upload-package.lftp
          lftp -f /tmp/upload-meta.lftp
          lftp -f /tmp/upload-manifest.lftp
          rm -f /tmp/upload-*.lftp
          echo "ALOOKHOR ${GITHUB_REF_NAME} published successfully."

