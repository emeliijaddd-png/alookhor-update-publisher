name: Build and Publish ALOOKHOR Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alookhor-production-publisher-v380
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private publisher repository
        uses: actions/checkout@v5

      - name: Inspect and enforce Explicit FTPS certificate
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_PORT"
          timeout 30 openssl s_client -starttls ftp -connect "${FTP_SERVER}:${FTP_PORT}" -servername "${FTP_SERVER}" -showcerts </dev/null > /tmp/ftps-chain.txt 2>/tmp/ftps-connect.txt
          awk '/-----BEGIN CERTIFICATE-----/{capture=1} capture{print} /-----END CERTIFICATE-----/{exit}' /tmp/ftps-chain.txt > /tmp/ftps-leaf.pem
          test -s /tmp/ftps-leaf.pem
          openssl x509 -in /tmp/ftps-leaf.pem -noout -subject -issuer -dates -fingerprint -sha256 -ext subjectAltName
          openssl x509 -in /tmp/ftps-leaf.pem -noout -checkhost "$FTP_SERVER"

      - name: Validate source syntax and managed-footer contract
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/generate_code_registry.py
          find plugin/alookhor-control-center -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          while IFS= read -r file; do node --check "$file"; done < <(find plugin/alookhor-control-center/assets/js -name '*.js' -type f | sort)
          python3 - <<'PY'
          from pathlib import Path
          required = [
              'plugin/alookhor-control-center/includes/footer.php','plugin/alookhor-control-center/assets/css/frontend-footer.css','plugin/alookhor-control-center/assets/js/frontend-footer.js','plugin/alookhor-control-center/assets/images/footer-prunes.png','plugin/alookhor-control-center/includes/product-categories.php','plugin/alookhor-control-center/assets/css/frontend-categories.css','plugin/alookhor-control-center/assets/js/frontend-categories.js','plugin/alookhor-control-center/assets/css/frontend-header-scroll.css','plugin/alookhor-control-center/assets/images/category-plums.jpg','plugin/alookhor-control-center/assets/images/category-fruit-sheets.jpg','plugin/alookhor-control-center/assets/images/category-natural-snacks.jpg','plugin/alookhor-control-center/assets/images/category-nuts.jpg','plugin/alookhor-control-center/includes/hero.php','plugin/alookhor-control-center/assets/css/frontend-hero.css','plugin/alookhor-control-center/assets/js/frontend-hero.js','plugin/alookhor-control-center/includes/site-features.php','plugin/alookhor-control-center/assets/css/frontend-features.css','plugin/alookhor-control-center/assets/js/frontend-features.js']
          for name in required: assert Path(name).is_file() and Path(name).stat().st_size > 0, name
          php=Path(required[0]).read_text(); css=Path(required[1]).read_text(); admin_css=Path('plugin/alookhor-control-center/assets/css/luxury.css').read_text(); js=Path(required[2]).read_text()
          assert 'id="alookhor-managed-footer"' in php
          assert "register_rest_route('alookhor-cc/v1', '/footer'" in Path('plugin/alookhor-control-center/includes/rest-api.php').read_text()
          assert '@media(max-width:767px)' in css and '.alookhor-mf-main-grid' in css
          assert '#quickSettings .qh-grid' in admin_css and '#quickSettings .qh-section textarea' in admin_css
          assert 'cache:\'no-store\'' in js and 'alookhor-mf-newsletter-form' in js
          category_php=Path('plugin/alookhor-control-center/includes/product-categories.php').read_text(); category_css=Path('plugin/alookhor-control-center/assets/css/frontend-categories.css').read_text(); category_js=Path('plugin/alookhor-control-center/assets/js/frontend-categories.js').read_text()
          assert "taxonomy'=>'product_cat'" in category_php and 'id="alookhor-managed-categories"' in category_php and "add_shortcode('alookhor_managed_categories'" in category_php and 'alookhor_cc_category_shortcode_rendered' in category_php
          assert '.alookhor-mc-card' in category_css and '--mc-cards' in category_css and '--mc-mobile-width' in category_css and '.alookhor-mc-arrow{display:none!important}' in category_css and 'flex-basis:33px!important' in category_css and '.alookhor-mc.has-single-page' in category_css and 'min-width:58px!important' in category_css and 'appearance:none!important' in category_css
          assert 'ResizeObserver' in category_js and "cache:'no-store'" in category_js and 'is-clone' in category_js and 'syncDots' in category_js and "tabIndex=mobile?-1:0" in category_js and "classList.toggle('has-single-page'" in category_js
          hero_php=Path('plugin/alookhor-control-center/includes/hero.php').read_text(); hero_css=Path('plugin/alookhor-control-center/assets/css/frontend-hero.css').read_text(); hero_js=Path('plugin/alookhor-control-center/assets/js/frontend-hero.js').read_text()
          assert "add_shortcode('alookhor_managed_hero'" in hero_php and 'id="alookhor-managed-hero"' in hero_php and 'alookhor-hero-slider-wrapper' in hero_php and 'data-slide-count="4"' in hero_php and 'for ($index=0; $index<4; $index++)' in hero_php
          assert 'body.alookhor-mh-hide-legacy .alookhor-hero-slider-wrapper' in hero_css and '@media(max-width:767px)' in hero_css and 'margin-top:-50px' in hero_css and '.alookhor-mh-content' in hero_css and 'right:' in hero_css and 'appearance:none!important' in hero_css and '.alookhor-mh .alookhor-mh-arrow:before' in hero_css and 'background:rgba(7,4,10,.56)!important' in hero_css and 'translateX(-36%)' in hero_css and 'scaleX(-1)' not in hero_css and 'rgba(7,3,10,.9) 100%' in hero_css
          assert "legacy_selector" in hero_php and 'legacy.replaceWith(section)' in hero_js and "cache:'no-store'" in hero_js and 'slides.length!==4' in hero_js and 'prefers-reduced-motion' in hero_js and "data-hero-media" in Path('plugin/alookhor-control-center/assets/js/modules/settings.js').read_text()
          feature_php=Path('plugin/alookhor-control-center/includes/site-features.php').read_text(); feature_css=Path('plugin/alookhor-control-center/assets/css/frontend-features.css').read_text(); feature_js=Path('plugin/alookhor-control-center/assets/js/frontend-features.js').read_text()
          assert "add_shortcode('alookhor_managed_features'" in feature_php and 'id="alookhor-managed-features"' in feature_php and 'alookhor-trustbar-container' in feature_php and 'for($index=0;$index<4;$index++)' in feature_php
          assert 'grid-template-columns:repeat(4,minmax(0,1fr))' in feature_css and '@media(max-width:767px)' in feature_css and 'margin:-15px calc(50% - 50vw) 0' in feature_css and 'margin-top:-15px' in feature_css and all(token in feature_php for token in ['#0D0510','#1C1024','rgba(33,20,38,.75)','#D49A2E','#E8B84A','#F5F3F0','#C8C2C9'])
          assert 'legacy.replaceWith(section)' in feature_js and "cache:'no-store'" in feature_js and 'data.item_count!==4' in feature_js and 'data-site-feature-flag' in Path('plugin/alookhor-control-center/assets/js/modules/settings.js').read_text()
          admin_template=Path('plugin/alookhor-control-center/templates/admin-control-center.php').read_text(); admin_app=Path('plugin/alookhor-control-center/assets/js/app.js').read_text(); dashboard_js=Path('plugin/alookhor-control-center/assets/js/modules/dashboard.js').read_text(); settings_js=Path('plugin/alookhor-control-center/assets/js/modules/settings.js').read_text(); admin_css=Path('plugin/alookhor-control-center/assets/css/luxury.css').read_text()
          assert admin_template.index('data-module="settings"') < admin_template.index('data-module="dashboard"') and 'nav-item-primary' in admin_template and 'data-group="sales"' in admin_template and "active: 'settings'" in admin_app and "allMods[hash] ? hash : 'settings'" in admin_app and 'data-dashboard-only="1"' in dashboard_js and 'dashboardAiCard' in dashboard_js and 'dashboardStatusCard' in dashboard_js and 'id="aiCard"' not in settings_js and 'id="statusCard"' not in settings_js and 'settings-workspace' in settings_js and 'width:100%; max-width:none' in admin_css and '.dashboard-monitor-grid' in admin_css
          header_scroll_css=Path('plugin/alookhor-control-center/assets/css/frontend-header-scroll.css').read_text(); topbar_manager=Path('plugin/alookhor-control-center/assets/js/frontend-topbar-manager.js').read_text(); header_php=Path('plugin/alookhor-control-center/includes/shortcode-header.php').read_text(); bootstrap_php=Path('plugin/alookhor-control-center/alookhor-control-center.php').read_text(); rest_php=Path('plugin/alookhor-control-center/includes/rest-api.php').read_text(); release_test=Path('scripts/wordpress_release_test.py').read_text()
          assert '.alookhor-legacy-nav-stage.is-stuck{position:fixed!important' in header_scroll_css and '.alookhor-legacy-nav-marker' in header_scroll_css and '.alookhor-topbar-wrapper' in header_scroll_css and 'position:relative!important' in header_scroll_css and 'setupHeaderBehavior' in topbar_manager and "header.after(marker, stage)" in topbar_manager and "navigation.before(document.createComment" in topbar_manager and "data-alookhor-navigation" in topbar_manager and 'alookhor-main-menu-toggle' in topbar_manager and 'alookhor-header-cart-link' in topbar_manager and 'alookhor-logo-copy' in topbar_manager and 'alookhor-topbar-support' in topbar_manager and 'alookhor-account-icon' in topbar_manager and "document.body.style.setProperty('padding-top', '0px'" in topbar_manager and "marker.style.setProperty('height'" in topbar_manager and '.alookhor-legacy-nav-marker,.alookhor-legacy-nav-stage{display:none!important}' in header_scroll_css and '.alookhor-managed-legacy-header .alookhor-topbar-wrapper,' in header_scroll_css and 'position:relative!important' in header_scroll_css
          assert "'header_logo_desktop_width' => 118" in header_php and "'header_logo_mobile_width' => 58" in header_php and 'inpHeaderLogoDesktop' in settings_js and 'inpHeaderLogoMobile' in settings_js and 'inpHeaderSearchPlaceholder' not in settings_js and "frontend-header-scroll.css" in bootstrap_php and "'sticky' => (bool) $h['sticky']" in bootstrap_php and all(token in header_scroll_css for token in ['--alookhor-capsule-glass:rgba(33,20,38,.75)','--alookhor-capsule-card:#1C1024','--alookhor-capsule-gold:#D49A2E','--alookhor-capsule-gold-light:#E8B84A','backdrop-filter:blur(var(--alookhor-capsule-blur))']) and all(token in topbar_manager for token in ['--alookhor-capsule-background','--alookhor-capsule-glass','--alookhor-capsule-gold-light','capsule_blur']) and 'inpCapsuleGlass' in settings_js and 'inpCapsuleBlur' in settings_js and 'capsule_gold_light' in settings_js
          assert 'alookhor_cc_migrate_header_brand_3106' in bootstrap_php and "'phone' => '09159513173'" in bootstrap_php and "'topbar_bg' => '#11091D'" in bootstrap_php and "'topbar_button_bg' => '#C9A86A'" in bootstrap_php and 'header_brand_migration' in rest_php and 'header_brand_palette' in release_test and 'alookhor_cc_migrate_header_layout_3107' in bootstrap_php and "'show_search'] = false" in bootstrap_php and 'header_layout_migration' in rest_php and 'alookhor_cc_migrate_header_reference_31019' in bootstrap_php and 'header_reference_migration' in rest_php and all(token in header_scroll_css for token in ['grid-template-areas:"support message phone"','is-capsule-integrated:not(.is-stuck)','top:-90px!important','padding:0 96px 0 560px','max-width:1360px']) and all(token in topbar_manager for token in ['is-capsule-integrated','--alookhor-integrated-nav-offset','glassBackground','alookhor-topbar-support-icon']) and "'topbar_bg' => '#1C1024'" in bootstrap_php and "'header_surface'=>'#0D0510'" in bootstrap_php
          print('Managed contracts passed')
          PY

      - name: Build and validate release
        id: release
        run: python3 scripts/build_release.py

      - name: Verify generated manifest and package
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          manifest=json.loads(Path('public/manifest.json').read_text()); package=Path('public/releases')/Path(manifest['download_url']).name
          assert package.is_file(); assert hashlib.sha256(package.read_bytes()).hexdigest()==manifest['sha256']
          with ZipFile(package) as archive: assert archive.testzip() is None and 'alookhor-control-center/alookhor-control-center.php' in archive.namelist()
          print('Release verification passed:',manifest['version'],manifest['sha256'])
          PY

      - name: Store dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: alookhor-release-${{ steps.release.outputs.version }}
          path: public/
          if-no-files-found: error
          retention-days: 7

  access_audit:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private publisher repository
        uses: actions/checkout@v5
      - name: Install FTPS client for safe probe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Probe restricted FTPS write, HTTPS read, and delete
        id: ftps_probe
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROBE_NAME: releases/publisher-probe-${{ github.run_id }}.txt
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from urllib.parse import quote
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip(); user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']; name=os.environ['PROBE_NAME']
          if '\n' in password or '\r' in password: raise SystemExit('FTP secret contains a newline')
          auth_url=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          if not re.fullmatch(r'[A-Za-z0-9.-]+',server) or not port.isdigit(): raise SystemExit('Invalid FTP endpoint')
          content='ALOOKHOR_PUBLISHER_PROBE_'+os.environ['GITHUB_RUN_ID']; Path('/tmp/publisher-probe.txt').write_text(content)
          common=['set cmd:fail-exit true','set net:max-retries 2','set ftp:passive-mode true','set ftp:ssl-auth TLS','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true',f'open -p {port} "{auth_url}"']
          for path,commands in {'/tmp/probe-upload.lftp':common+[f'put /tmp/publisher-probe.txt -o {name}','bye'],'/tmp/probe-delete.lftp':common+[f'rm -f {name}','bye']}.items():
              p=Path(path); p.write_text(';\n'.join(commands)+';\n'); p.chmod(0o600)
          PY
          set +e
          lftp -f /tmp/probe-upload.lftp > /tmp/ftps-probe.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python3 - <<'PY' >> /tmp/ftps-probe.log 2>&1
          import os,urllib.request
          expected='ALOOKHOR_PUBLISHER_PROBE_'+os.environ['GITHUB_RUN_ID']; url='https://updates.alookhor.ir/'+os.environ['PROBE_NAME']+'?run='+os.environ['GITHUB_RUN_ID']
          with urllib.request.urlopen(url,timeout=30) as response: actual=response.read().decode()
          if actual != expected: raise SystemExit('HTTPS probe content mismatch')
          print('FTPS root mapping and HTTPS read verified')
          PY
            code=$?
          fi
          lftp -f /tmp/probe-delete.lftp >> /tmp/ftps-probe.log 2>&1 || true
          rm -f /tmp/probe-upload.lftp /tmp/probe-delete.lftp /tmp/publisher-probe.txt
          exit "$code"
