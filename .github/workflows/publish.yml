name: Build and Publish ALOOKHOR Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alookhor-production-publisher-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate and generate registry
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          python3 scripts/generate_code_registry.py
          find plugin/alookhor-control-center -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          while IFS= read -r file; do node --check "$file"; done < <(find plugin/alookhor-control-center/assets/js -name '*.js' -type f | sort)
      - name: Build release
        id: release
        run: python3 scripts/build_release.py
      - name: Verify package
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          m=json.loads(Path('public/manifest.json').read_text())
          p=Path('public/releases')/Path(m['download_url']).name
          assert p.is_file()
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          with ZipFile(p) as z: assert z.testzip() is None
          print('Release verification passed:',m['version'])
          PY
      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: alookhor-release-${{ steps.release.outputs.version }}
          path: public/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build verified release
        run: python3 scripts/build_release.py
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Emergency replace broken live plugin
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          from urllib.parse import quote
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip(); user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']
          auth=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          common=['set cmd:fail-exit true','set net:max-retries 2','set net:timeout 30','set ftp:passive-mode true','set ftp:ssl-auth TLS','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true',f'open -p {port} "{auth}"']
          script=Path('/tmp/emergency.lftp')
          script.write_text('\\n'.join(common+['cd "../public_html/wp-content/plugins/alookhor-control-center"','mirror -R --delete --overwrite plugin/alookhor-control-center .','bye'])+'\\n')
          script.chmod(0o600)
          q=subprocess.run(['lftp','-f',str(script)])
          if q.returncode: raise SystemExit('Emergency live plugin replacement failed')
          print('EMERGENCY_LIVE_PLUGIN_REPLACEMENT=SUCCESS')
          PY
          rm -f /tmp/emergency.lftp
      - name: Force replace duplicate-header file
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          from urllib.parse import quote
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip(); user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']
          auth=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          common=['set cmd:fail-exit true','set net:max-retries 2','set net:timeout 30','set ftp:passive-mode true','set ftp:ssl-auth TLS','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true',f'open -p {port} "{auth}"']
          script=Path('/tmp/force-header.lftp')
          script.write_text('\\n'.join(common+['cd "../public_html/wp-content/plugins/alookhor-control-center/includes"','rm -f shortcode-header.php','put plugin/alookhor-control-center/includes/shortcode-header.php -o shortcode-header.php','bye'])+'\\n')
          script.chmod(0o600)
          q=subprocess.run(['lftp','-f',str(script)])
          if q.returncode: raise SystemExit('Forced header replacement failed')
          print('FORCE_HEADER_REPLACEMENT=SUCCESS')
          PY
          rm -f /tmp/force-header.lftp
      - name: Replace live plugin directory atomically
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          from urllib.parse import quote
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip(); user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']
          auth=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          common=['set cmd:fail-exit true','set net:max-retries 2','set net:timeout 30','set ftp:passive-mode true','set ftp:ssl-auth TLS','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true',f'open -p {port} "{auth}"']
          script=Path('/tmp/atomic.lftp')
          script.write_text('\\n'.join(common+['cd "../public_html/wp-content/plugins"','mv alookhor-control-center alookhor-control-center-recovery-old','mkdir alookhor-control-center','mirror -R --overwrite plugin/alookhor-control-center ./alookhor-control-center','bye'])+'\\n')
          script.chmod(0o600)
          q=subprocess.run(['lftp','-f',str(script)])
          if q.returncode: raise SystemExit('Atomic live plugin replacement failed')
          print('ATOMIC_LIVE_PLUGIN_REPLACEMENT=SUCCESS')
          PY
          rm -f /tmp/atomic.lftp
      - name: Publish through explicit FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"; test -n "$FTP_PORT"; test -n "$FTP_USERNAME"; test -n "$FTP_PASSWORD"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.parse import quote
          m=json.loads(Path('public/manifest.json').read_text())
          package=Path(m['download_url']).name
          server=os.environ['FTP_SERVER'].strip(); port=os.environ['FTP_PORT'].strip()
          user=os.environ['FTP_USERNAME'].strip(); password=os.environ['FTP_PASSWORD']
          if not port.isdigit(): raise SystemExit('Invalid FTP_PORT')
          auth=f"ftp://{quote(user,safe='')}:{quote(password,safe='')}@{server}"
          common=['set cmd:fail-exit true','set net:max-retries 2','set net:timeout 30','set ftp:passive-mode true','set ftp:ssl-auth TLS','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true',f'open -p {port} "{auth}"']
          files={
            '/tmp/upload-package.lftp':common+['# releases directory already exists on the FTP target',f'put public/releases/{package} -o releases/{package}','bye'],
            '/tmp/upload-meta.lftp':common+['put public/releases/SHA256SUMS.txt -o releases/SHA256SUMS.txt','put public/index.html -o index.html','put public/changelog.html -o changelog.html','put public/.htaccess -o .htaccess','bye'],
            '/tmp/upload-manifest.lftp':common+['put public/manifest.json -o manifest.json.next','mv manifest.json.next manifest.json','bye']}
          for name,commands in files.items():
            Path(name).write_text('\n'.join(commands)+'\n'); Path(name).chmod(0o600)
          PY
          lftp -f /tmp/upload-package.lftp
          lftp -f /tmp/upload-meta.lftp
          lftp -f /tmp/upload-manifest.lftp
          rm -f /tmp/upload-*.lftp
          echo "ALOOKHOR ${GITHUB_REF_NAME} published successfully."
