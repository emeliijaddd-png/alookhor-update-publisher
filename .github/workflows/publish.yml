name: Build and Publish ALOOKHOR Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alookhor-production-publisher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      package: ${{ steps.release.outputs.package }}
      sha256: ${{ steps.release.outputs.sha256 }}
    steps:
      - name: Checkout private publisher repository
        uses: actions/checkout@v5

      - name: Inspect Explicit FTPS certificate
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -o pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_PORT"
          timeout 30 openssl s_client \
            -starttls ftp \
            -connect "${FTP_SERVER}:${FTP_PORT}" \
            -servername "${FTP_SERVER}" \
            -showcerts </dev/null > /tmp/ftps-chain.txt 2>/tmp/ftps-connect.txt
          awk '/-----BEGIN CERTIFICATE-----/{capture=1} capture{print} /-----END CERTIFICATE-----/{exit}' /tmp/ftps-chain.txt > /tmp/ftps-leaf.pem
          test -s /tmp/ftps-leaf.pem
          echo '=== FTPS LEAF CERTIFICATE ==='
          openssl x509 -in /tmp/ftps-leaf.pem -noout -subject -issuer -dates -fingerprint -sha256 -ext subjectAltName
          echo '=== HOSTNAME CHECK: configured FTP_SERVER ==='
          openssl x509 -in /tmp/ftps-leaf.pem -noout -checkhost "$FTP_SERVER" || true
          echo '=== REVERSE DNS ==='
          python3 - <<'PY'
          import os, socket
          host = os.environ['FTP_SERVER']
          ip = socket.gethostbyname(host)
          print('Configured host:', host)
          print('Resolved IP:', ip)
          try:
              print('PTR hostname:', socket.gethostbyaddr(ip)[0])
          except OSError as error:
              print('PTR lookup failed:', error)
          PY

      - name: Build and validate release
        id: release
        run: python3 scripts/build_release.py

      - name: Verify generated manifest and package
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from zipfile import ZipFile
          manifest = json.loads(Path('public/manifest.json').read_text())
          package = Path('public/releases') / Path(manifest['download_url']).name
          assert package.is_file()
          assert hashlib.sha256(package.read_bytes()).hexdigest() == manifest['sha256']
          with ZipFile(package) as archive:
              assert archive.testzip() is None
          print('Release verification passed:', manifest['version'], manifest['sha256'])
          PY

      - name: Store dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: alookhor-release-${{ steps.release.outputs.version }}
          path: public/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout private publisher repository
        uses: actions/checkout@v5

      - name: Rebuild verified release
        run: python3 scripts/build_release.py

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Validate deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_PORT"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Publish package first and manifest last
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          def lftp_quote(value):
              if '\n' in value or '\r' in value:
                  raise SystemExit('FTP secret contains a newline')
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          server = os.environ['FTP_SERVER'].strip()
          port = os.environ['FTP_PORT'].strip()
          user = os.environ['FTP_USERNAME'].strip()
          password = os.environ['FTP_PASSWORD']
          package = os.environ['PACKAGE'].strip()
          if not re.fullmatch(r'[A-Za-z0-9.-]+', server):
              raise SystemExit('Invalid FTP_SERVER')
          if not port.isdigit():
              raise SystemExit('Invalid FTP_PORT')
          if not re.fullmatch(r'[A-Za-z0-9._-]+\.zip', package):
              raise SystemExit('Invalid package name')

          commands = [
              'set cmd:fail-exit true',
              'set net:max-retries 2',
              'set net:timeout 20',
              'set ftp:passive-mode true',
              'set ftp:ssl-auth TLS',
              'set ftp:ssl-force true',
              'set ftp:ssl-protect-data true',
              'set ssl:verify-certificate true',
              f'open -p {port} ftp://{server}',
              f'user {lftp_quote(user)} {lftp_quote(password)}',
              'mkdir -p releases',
              f'put public/releases/{package} -o releases/{package}',
              'put public/releases/SHA256SUMS.txt -o releases/SHA256SUMS.txt',
              'put public/index.html -o index.html',
              'put public/changelog.html -o changelog.html',
              'put public/.htaccess -o .htaccess',
              'put public/manifest.json -o manifest.json.next',
              'mv manifest.json.next manifest.json',
              'bye',
          ]
          path = Path('/tmp/alookhor-deploy.lftp')
          path.write_text(';\n'.join(commands) + ';\n')
          path.chmod(0o600)
          PY
          lftp -f /tmp/alookhor-deploy.lftp
          rm -f /tmp/alookhor-deploy.lftp

      - name: Verify production manifest
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = f"https://updates.alookhor.ir/manifest.json?github_run={os.environ['GITHUB_RUN_ID']}"
          for attempt in range(6):
              with urllib.request.urlopen(url, timeout=20) as response:
                  manifest = json.load(response)
              if manifest.get('version') == os.environ['EXPECTED_VERSION'] and manifest.get('sha256') == os.environ['EXPECTED_SHA']:
                  print('Production verified:', manifest['version'], manifest['sha256'])
                  break
              time.sleep(10)
          else:
              raise SystemExit(f'Production manifest did not update: {manifest}')
          PY
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          GITHUB_RUN_ID: ${{ github.run_id }}
