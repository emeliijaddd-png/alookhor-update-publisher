name: Apply ALOOKHOR Header Luxury Release

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_header_luxury.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alookhor-header-luxury
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply header design patch
        run: python3 scripts/apply_header_luxury.py

      - name: Bump plugin and release metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          old = '3.10.24'
          new = '3.10.25'

          plugin = Path('plugin/alookhor-control-center/alookhor-control-center.php')
          text = plugin.read_text(encoding='utf-8')
          required = [
              f' * Version: {old}',
              f"define('ALOOKHOR_CC_VERSION', '{old}')",
              f"define('ALOOKHOR_CC_BUILD', '{old}')",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Expected version token not found: {token}')
          text = text.replace(f' * Version: {old}', f' * Version: {new}', 1)
          text = text.replace(f"define('ALOOKHOR_CC_VERSION', '{old}')", f"define('ALOOKHOR_CC_VERSION', '{new}')", 1)
          text = text.replace(f"define('ALOOKHOR_CC_BUILD', '{old}')", f"define('ALOOKHOR_CC_BUILD', '{new}')", 1)
          plugin.write_text(text, encoding='utf-8')

          release = Path('release.json')
          data = json.loads(release.read_text(encoding='utf-8'))
          if str(data.get('version')) != old:
              raise SystemExit(f"release.json expected {old}, found {data.get('version')}")
          data['version'] = new
          data['previous'] = old
          data['state'] = 'ready'
          data['description'] = 'هدر شیشه‌ای لوکس بنفش تیره با Mega Menu واقعی مبتنی بر منوهای وردپرس، بدون تغییر در شورت‌کد و جایگاه Elementor.'
          data['reason'] = 'درخواست صریح برای ارتقای ظاهر هدر به Glassmorphism بنفش لوکس و تبدیل منوهای دارای زیرمنو به Mega Menu واقعی، با حفظ ساختار فعلی Elementor/WordPress/WooCommerce.'
          data['files'] = [
              'plugin/alookhor-control-center/includes/shortcode-header.php',
              'plugin/alookhor-control-center/assets/css/frontend-header.css',
              'plugin/alookhor-control-center/alookhor-control-center.php',
              'scripts/apply_header_luxury.py',
          ]
          data['changelog'] = [
              {
                  'tag': 'LUXURY GLASS',
                  'title': 'هدر بنفش شیشه‌ای لوکس',
                  'desc': 'کپسول اصلی هدر با شیشه واقعی، Blur و بنفش تیره لوکس با تأکید طلایی ارتقا یافت؛ تنظیمات رنگ کپسول در Control Center باقی می‌ماند.'
              },
              {
                  'tag': 'WORDPRESS MEGA MENU',
                  'title': 'Mega Menu واقعی',
                  'desc': 'آیتم‌های سطح اول دارای زیرمنو در منوی واقعی WordPress به پنل Mega Menu چندستونه تبدیل می‌شوند و داده ثابت جدیدی به سایت اضافه نمی‌شود.'
              },
              {
                  'tag': 'ELEMENTOR SAFE',
                  'title': 'بدون تغییر در Elementor',
                  'desc': 'شورت‌کد [alookhor_portal_header] و Shortcode Widget فعلی حفظ می‌شوند و تغییر از مسیر آپدیت پلاگین اعمال می‌شود.'
              }
          ]
          release.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate and enforce code registry
        run: |
          python3 scripts/generate_code_registry.py
          python3 scripts/generate_code_registry.py --check

      - name: Validate changed PHP and release metadata
        run: |
          php -l plugin/alookhor-control-center/includes/shortcode-header.php
          php -l plugin/alookhor-control-center/alookhor-control-center.php
          python3 -m py_compile scripts/apply_header_luxury.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('release.json').read_text(encoding='utf-8'))
          assert release['version']=='3.10.25'
          header=Path('plugin/alookhor-control-center/includes/shortcode-header.php').read_text(encoding='utf-8')
          css=Path('plugin/alookhor-control-center/assets/css/frontend-header.css').read_text(encoding='utf-8')
          assert 'ALOOKHOR-LUXURY-PURPLE-V1' in header
          assert 'alookhor-mega-item' in header
          assert '#12051F' in css and '#24102F' in css and 'rgba(47,20,66,.78)' in css
          assert '#D4AF37' in css and 'backdrop-filter:blur(24px)' in css
          assert 'alookhor-primary-menu>li.alookhor-mega-item>.sub-menu' in css
          assert 'alookhor-portal-header' in header
          assert 'alookhor_portal_header' in header
          PY
          git diff --check

      - name: Commit source release
        run: |
          git config user.name 'ALOOKHOR Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git add plugin/alookhor-control-center/includes/shortcode-header.php \
                  plugin/alookhor-control-center/assets/css/frontend-header.css \
                  plugin/alookhor-control-center/alookhor-control-center.php \
                  scripts/apply_header_luxury.py \
                  docs/MASTER_CODE_REGISTRY.md \
                  release.json
          git commit -m 'release: ALOOKHOR header luxury purple mega menu 3.10.25'
          git push origin main

      - name: Create release tag
        run: |
          if git rev-parse 'v3.10.25' >/dev/null 2>&1; then
            echo 'v3.10.25 already exists.'
          else
            git tag -a v3.10.25 -m 'ALOOKHOR 3.10.25 — Luxury Purple Glass Header + WordPress Mega Menu'
            git push origin v3.10.25
          fi
