<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پیش‌نمایش قاب خرید لوکس — ALOOKHOR 3.10.20</title>
<link rel="stylesheet" href="../plugin/alookhor-control-center/assets/css/frontend-buybox.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{background:#0D0510;margin:0;min-height:100%}
  body{font-family:"Vazirmatn",Tahoma,sans-serif;padding:26px 14px 60px}
  .demo-note{max-width:520px;margin:0 auto 16px;color:#8f83a4;font-size:12.5px;text-align:center;line-height:1.9}
  .demo-note b{color:#E8B84A}
  .demo-stage{max-width:520px;margin:0 auto}
</style>
</head>
<body>

<div class="demo-note">پیش‌نمایش استاتیک ماژول «قاب خرید لوکس» — نسخه <b>3.10.20</b> • متغیر «۵۰۰ گرم» به‌صورت پیش‌فرض انتخاب شده • روی وزن‌ها کلیک کنید تا قیمت/تخفیف زنده عوض شود</div>

<div class="demo-stage">
  <div class="alk-bb" data-product-id="100138" data-alk-state="ready">

    <div class="alk-bb-price-card">
      <div class="alk-bb-price-head">
        <span class="alk-bb-label">قیمت محصول :</span>
        <span class="alk-bb-sale-badge">۱۳٪ تخفیف</span>
      </div>
      <div class="alk-bb-price-body">
        <div class="alk-bb-price-now">
          <span class="alk-bb-amount alk-bb-amount--now"><bdi class="alk-bb-amount__num">۱۸۵٬۰۰۰</bdi> <span class="alk-bb-amount__cur">تومان</span></span>
        </div>
        <div class="alk-bb-price-old">
          <del><span class="alk-bb-amount alk-bb-amount--old"><bdi class="alk-bb-amount__num">۲۲۰٬۰۰۰</bdi> <span class="alk-bb-amount__cur">تومان</span></span></del>
        </div>
      </div>
    </div>

    <div class="alk-bb-attr" data-attribute-name="attribute_pa_weight">
      <span class="alk-bb-label">انتخاب وزن :</span>
      <div class="alk-bb-pills" role="group" aria-label="وزن">
        <button type="button" class="alk-bb-pill" data-price="98000" aria-pressed="false">۲۵۰ گرم</button>
        <button type="button" class="alk-bb-pill is-active" data-price="185000" data-regular="220000" aria-pressed="true">۵۰۰ گرم</button>
        <button type="button" class="alk-bb-pill" data-price="355000" data-regular="420000" aria-pressed="false">۱ کیلوگرم</button>
      </div>
    </div>

    <div class="alk-bb-form">
      <form class="cart" onsubmit="return false">
        <span class="alk-bb-qty-label alk-bb-label">تعداد :</span>
        <button type="button" class="alk-bb-qbtn alk-bb-qbtn--minus" aria-label="کاهش تعداد">−</button>
        <div class="quantity"><label class="screen-reader-text">تعداد</label><input type="number" class="input-text qty text" step="1" min="1" max="" value="1" inputmode="numeric"></div>
        <button type="button" class="alk-bb-qbtn alk-bb-qbtn--plus" aria-label="افزایش تعداد">+</button>

        <button type="submit" class="single_add_to_cart_button button alt">افزودن به سبد خرید</button>

        <span class="alk-bb-actions">
          <button type="button" class="alk-bb-iconbtn alk-bb-iconbtn--wishlist" aria-label="افزودن به علاقه‌مندی‌ها" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          </button>
          <button type="button" class="alk-bb-iconbtn alk-bb-iconbtn--compare" aria-label="افزودن به مقایسه" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
          </button>
          <button type="button" class="alk-bb-iconbtn alk-bb-iconbtn--share" aria-label="اشتراک‌گذاری محصول">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
        </span>
      </form>
    </div>

    <div class="alk-bb-status">
      <span class="alk-bb-stock alk-bb-stock--in"><i class="alk-bb-stock__dot" aria-hidden="true"></i><span class="alk-bb-stock__text">موجود در انبار</span></span>
      <span class="alk-bb-ship">ارسال از ۱ روز کاری آینده</span>
    </div>

  </div>
</div>

<script>
/* شبیه‌ساز دورهمی برای پیش‌نمایش تصویری (رفتار واقعی روی وردپرس از frontend-buybox.js می‌آید) */
(function(){
  var FA='۰۱۲۳۴۵۶۷۸۹';
  var fa=function(s){return String(s).replace(/[0-9]/g,function(d){return FA[+d];})};
  var fmt=function(n){return fa(String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'٬'))};
  var box=document.querySelector('.alk-bb');
  var now=box.querySelector('.alk-bb-price-now');
  var old=box.querySelector('.alk-bb-price-old');
  var badge=box.querySelector('.alk-bb-sale-badge');
  function amount(n,cls){return '<span class="alk-bb-amount alk-bb-amount--'+cls+'"><bdi class="alk-bb-amount__num">'+fmt(n)+'</bdi> <span class="alk-bb-amount__cur">تومان</span></span>'}

  box.querySelectorAll('.alk-bb-pill').forEach(function(p){
    p.addEventListener('click',function(){
      box.querySelectorAll('.alk-bb-pill').forEach(function(x){x.classList.remove('is-active');x.setAttribute('aria-pressed','false')});
      p.classList.add('is-active');p.setAttribute('aria-pressed','true');
      var price=+p.dataset.price, reg=+(p.dataset.regular||0);
      now.innerHTML=amount(price,'now');
      var pct=reg>price?Math.round((1-price/reg)*100):0;
      if(pct>0){old.innerHTML='<del>'+amount(reg,'old')+'</del>';old.hidden=false;badge.textContent=fa(pct)+'٪ تخفیف';badge.hidden=false;}
      else{old.hidden=true;badge.hidden=true;}
    });
  });

  var qty=box.querySelector('input.qty');
  box.querySelector('.alk-bb-qbtn--plus').addEventListener('click',function(){qty.value=(+qty.value||1)+1});
  box.querySelector('.alk-bb-qbtn--minus').addEventListener('click',function(){qty.value=Math.max(1,(+qty.value||1)-1)});

  function toast(msg){
    var t=document.querySelector('.alk-bb-toast');
    if(!t){t=document.createElement('div');t.className='alk-bb-toast';document.body.appendChild(t)}
    t.textContent=msg;t.classList.add('is-visible');
    clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('is-visible')},2000);
  }
  box.querySelector('.alk-bb-iconbtn--wishlist').addEventListener('click',function(){
    var on=this.classList.toggle('is-on');this.setAttribute('aria-pressed',on?'true':'false');
    toast(on?'به علاقه‌مندی‌ها اضافه شد':'از علاقه‌مندی‌ها حذف شد');
  });
  box.querySelector('.alk-bb-iconbtn--compare').addEventListener('click',function(){
    var on=this.classList.toggle('is-on');this.setAttribute('aria-pressed',on?'true':'false');
    toast(on?'به مقایسه اضافه شد':'از مقایسه حذف شد');
  });
  box.querySelector('.alk-bb-iconbtn--share').addEventListener('click',function(){
    if(navigator.clipboard){navigator.clipboard.writeText('https://alookhor.ir/product/sample/').then(function(){toast('لینک محصول کپی شد')})}
    else{toast('لینک محصول کپی شد')}
  });
})();
</script>
</body>
</html>
